{{- /*
Namespace-scoped access to BMC credential Secrets for BCM and NetBox inventory.

The operator reads and manages BMC credential Secrets only in the Metal3
(BMH) namespace, so this is a namespaced Role + RoleBinding — not a cluster-wide
rule on the manager ClusterRole. BCM uses bcm.bmhNamespace; NetBox uses
metal3.namespace.
*/ -}}
{{- $bmhNamespace := "" -}}
{{- if .Values.bcm.enabled -}}
{{- $bmhNamespace = .Values.bcm.bmhNamespace -}}
{{- else if .Values.netbox.enabled -}}
{{- $bmhNamespace = .Values.metal3.namespace -}}
{{- end -}}
{{- if $bmhNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-bmc-secrets
  namespace: {{ $bmhNamespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-bmc-secrets
  namespace: {{ $bmhNamespace }}
  labels:
    {{- include "bare-metal-fulfillment-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bare-metal-fulfillment-operator.fullname" . }}-bmc-secrets
subjects:
- kind: ServiceAccount
  name: {{ include "bare-metal-fulfillment-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
